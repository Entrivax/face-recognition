# recogn — basic compose setup.
#
# First run (the server ALWAYS requires login — there is no open mode):
#   1. docker compose up --build
#   2. docker compose logs recogn    # look for: setup key: XXXX-XXXX-XXXX-XXXX
#   3. open http://localhost:8080, enter the setup key and pick the admin
#      username + password (the key is in-memory only and regenerated on every
#      start until an admin exists)
#   4. create repositories and users from the admin UI; users get per-repo
#      reader/writer roles, and can mint personal API keys (rk_...)
#
# There is no default repository. To wrap an existing legacy dataset (flat
# people/<Person>/ folders) into one repository:
#   docker compose run --rm recogn repo import --name "My people"
# then enroll it: docker compose run --rm recogn enroll --repo "My people"
#
# To add someone new: drop people/<repo>/<Person>/*.jpg into the repository's
# folder and hit POST /api/enroll?repo=... (writer) or the UI's rescan. Photos
# enrolled through the API/UI are saved back into the repository's folder (as
# <Person>/<sha1>.<ext>), so the mount below must stay writable.
#
# The ONNX models are not baked into the image: on first start the app
# downloads the insightface buffalo_l pack (~289 MB) into ./models and keeps
# only the two .onnx files it needs. If the folder already holds the models
# (e.g. `make models`) nothing is downloaded.

services:
  recogn:
    build: .
    image: recogn:latest
    container_name: recogn
    ports:
      # Loopback-only by default: the UI/API stay reachable from this machine
      # (and through an SSH tunnel or reverse proxy). To serve your LAN or the
      # public internet, switch to "8080:8080" — login is always required now
      # (only /api/setup, /api/login, /api/health and enabled share links are
      # reachable unauthenticated), but still put a TLS reverse proxy in
      # front for anything remote.
      - "127.0.0.1:8080:8080"
      # - "8080:8080"
    environment:
      # Tune recognition strictness (0..1). Higher = fewer false positives.
      RECOGN_THRESHOLD: "0.45"
      # RECOGN_ADDR: ":8080"        # listen address inside the container
      #
      # Sessions are in-memory (restarts log everyone out; users log in with
      # username + password — the admin is created via the first-run setup
      # key, see the header comment):
      # RECOGN_SESSION_TTL: "24h"   # sliding session lifetime (Go duration)
      #
      # Model source knobs (see the ./models mount below):
      # RECOGN_MODELS_URL: "https://your-mirror/buffalo_l.zip"   # own pack mirror
      # RECOGN_AUTO_DOWNLOAD: "0"   # only with the models already in ./models
    volumes:
      # ONNX models (SCRFD + ArcFace). Mounted, not baked in, to keep the
      # image ~190 MB smaller. On first start the app downloads the
      # insightface buffalo_l pack (~289 MB) into ./models and extracts only
      # det_10g.onnx + w600k_r50.onnx — so the folder must be writable by the
      # container's uid 10001 on that first run (e.g. `sudo chown -R 10001
      # ./models`). Once the models are there nothing is written, so a
      # pre-populated ./models may even be mounted read-only. Point
      # RECOGN_MODELS_URL at your own pack for mirrors / air-gapped hosts.
      - ./models:/data/models
      # The datasets: ./people is the REPOS ROOT — one folder per repository
      # (./people/<repo-uuid>/<Person Name>/*.jpg; the display name is
      # managed in the admin UI). Repositories are created there from the
      # admin UI; legacy flat people/<Person>/ folders can be wrapped into a
      # repository with `recogn repo import`. Mounted writable so API/UI
      # enrollments can save uploaded photos into it. The container runs as
      # uid 10001; make sure the host folder allows writes for that uid
      # (e.g. `sudo chown -R 10001 ./people`).
      - ./people:/data/people
      # Persist the face DB (data/faces.db), the user DB (data/users.db) and
      # the thumbnails across rebuilds/restarts.
      - ./data:/data/db
    restart: unless-stopped
    # Liveness: the app exposes /api/health. (curl is in the runtime image.)
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5m    # first start may download ~289 MB of models before serving
