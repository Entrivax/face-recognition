# recogn — basic compose setup.
#
#   docker compose up --build        # build the image and start the API + UI
#   open http://localhost:8080
#
# On first start, if the face DB is empty and a people/ dataset is mounted,
# the server enrolls everyone automatically before serving.
#
# To add someone new: drop people/<Name>/*.jpg into ./people and either
# restart, hit POST /api/enroll, or use the "Rescan people folder" button.

services:
  recogn:
    build: .
    image: recogn:latest
    container_name: recogn
    ports:
      - "8080:8080"
    environment:
      # Tune recognition strictness (0..1). Higher = fewer false positives.
      RECOGN_THRESHOLD: "0.45"
      # RECOGN_ADDR: ":8080"        # listen address inside the container
    volumes:
      # Your dataset, mounted read-only: ./people/<Person Name>/*.jpg
      - ./people:/data/people:ro
      # Persist the generated face DB across rebuilds/restarts.
      - ./data:/data/db
    restart: unless-stopped
    # Liveness: the app exposes /api/health. (curl is in the runtime image.)
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s   # allow time for first-run enrollment + model warmup
